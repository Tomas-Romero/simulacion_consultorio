<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Simulador de un policonsultorio para decidir cuántos sobreturnos dar y dónde ubicarlos. Proyecto integrador de Simulación, UTN FRSR 2026." />
    <meta name="color-scheme" content="light dark" />
    <title>Sobreturnos · simulación de un policonsultorio</title>
    <link rel="icon" type="image/png" href="./marca/isotipo-32.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Fraunces:opsz,wght@9..144,400..700&display=swap"
    />
    <script>
      // Tema antes del primer pintado (evita el destello): preferencia guardada o la del sistema.
      (function () {
        var t = null;
        try { t = localStorage.getItem('sobreturnos.tema'); } catch (e) {}
        var m = /[?&]tema=(claro|oscuro)/.exec(location.hash);
        if (m) t = m[1];
        if (t === 'claro' || t === 'oscuro') document.documentElement.dataset.tema = t;
      })();
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
